[project]
name = "cybertone-f5tts"
version = "0.1.0"
description = "F5-TTS zero-shot cloning service for CyberTone (runs on Apple silicon / MPS)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "f5-tts>=1.0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "scipy>=1.11",
    "soundfile>=0.12",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false
